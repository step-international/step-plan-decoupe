# Déploiement du site statique sur GitHub Pages.
#
# [passation 2026.08.24] On ne publie PLUS le dépôt entier (`path: '.'`).
# Motif : GitHub Pages servait publiquement firestore.rules, storage.rules,
# functions/index.js, CLAUDE.md, tests/ et graphify-out/ — vérifié en HTTP 200.
# Seuls les 3 fichiers dont l'application a besoin au runtime sont publiés.
# Le service worker (sw.js) ne met en cache que index.html + les SDK Firebase,
# et manifest.json ne déclare aucune icône : cette liste est donc complète.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # [L520] les PR vers main (routine « signalements », branches auto/*) passent le job verifier ; deploy reste main seulement
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  # [L520 · passe adverse] les runs de PR ne deploient rien : groupe distinct par branche, sinon un run de PR pouvait
  # evincer en file un deploiement de main en attente (cancel-in-progress:false ne garde qu UN run pending par groupe).
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.head_ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # [L504 · audit 30 agents, pattern 3] VERIFICATION BLOQUANTE : un hook pre-push se contourne (--no-verify),
  # `needs:` non. Tout ce qui tourne sans navigateur : syntaxe, moteur gele, tests unitaires, gardien,
  # recensement des ecritures. Sims et smokes restent locaux (tests/battery.sh) — Chrome n est pas ici.
  verifier:
    runs-on: ubuntu-latest
    # [L505] fuseau de l atelier : les KPI mensuels sont « mois LOCAL » (convention L98) et kpi_test.js l encode ;
    # sous UTC (runner) un cas de bord de journee change de mois -> rouge en CI, vert sur les Mac/tablettes (1er passage reel du job).
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # [L520] historique complet : comparaison avec origin/main (bump, unicite, meta-gardien)
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Version bumpee vs origin/main, jamais reutilisee (battery.sh etape 0, transposee — L520)
        run: |
          set -euo pipefail
          git fetch -q origin main
          L=$(grep -o "APP_VERSION='[^']*'" index.html | head -1)
          R=$(git show origin/main:index.html | grep -o "APP_VERSION='[^']*'" | head -1 || echo "")
          if [ -n "$R" ] && [ "$L" = "$R" ] && ! git diff --quiet origin/main -- index.html; then echo "index.html modifie mais APP_VERSION identique a origin/main ($L) : bump obligatoire (regle 6)"; exit 1; fi
          if [ "$L" != "$R" ] && [ -n "$(git log origin/main -S"$L" --oneline -- index.html)" ]; then echo "$L a DEJA existe sur main : deux lots sous un meme LNNN — choisir le numero suivant"; exit 1; fi
          echo "$L (origin/main : ${R:-?})"
      - name: Meta-gardien — sur origin/main le gardien doit etre ROUGE si index.html change (battery.sh etape 4b — L520)
        run: |
          set -euo pipefail
          if git diff --quiet origin/main -- index.html; then echo "index.html identique a origin/main : sans objet"; exit 0; fi
          git show origin/main:index.html > /tmp/_prev.html
          if AUDIT_HTML=/tmp/_prev.html node tests/audit_regress_test.js >/dev/null 2>&1; then echo "le gardien est VERT sur origin/main : aucun marqueur de ce lot ne discrimine"; exit 1; fi
          echo "meta-gardien OK : $(AUDIT_HTML=/tmp/_prev.html node tests/audit_regress_test.js 2>/dev/null | grep -c '❌' || true) marqueur(s) rouge(s) sur origin/main"
      - name: Syntaxe (3 scripts inline compilent)
        run: node tests/syntax_test.js
      - name: Moteur gele (empreintes figees)
        run: node tests/engine_identity.js
      - name: Tests unitaires (liste derivee du disque)
        run: |
          set -euo pipefail
          for f in tests/*_test.js; do
            case "$f" in *audit_regress_test.js|*syntax_test.js) continue;; esac
            echo "== $f"; node "$f" > /tmp/_t.log 2>&1 || { cat /tmp/_t.log; echo "ECHEC $f"; exit 1; }
          done
      - name: Gardien de regression (code de sortie)
        run: node tests/audit_regress_test.js > /tmp/_g.log 2>&1 || { grep -E "❌|💥" /tmp/_g.log; exit 1; }
      - name: Recensement ecritures Firestore non bornees (doit etre vide)
        run: |
          set -euo pipefail
          UNB=$(grep -n "db\.collection([^)]*)\(\.doc([^)]*)\)\?\.\(set\|update\|delete\|add\)(" index.html | grep -v "boundedWrite\|boundedTx\|raceTimeout\|_commitRace\|_bw(\|tx\.\|batch\." | grep "await " || true)
          [ -z "$UNB" ] || { echo "$UNB"; exit 1; }
          UNB2=$(grep -nE "await [A-Za-z_$][A-Za-z0-9_$.]*\.(set|update|delete|add|commit)\(" index.html | grep -vE "_bw\(|boundedWrite|boundedTx|raceTimeout|refFromURL|\.add\(new |classList|searchParams|headers" || true)
          [ -z "$UNB2" ] || { echo "$UNB2"; exit 1; }
          UNB3=$(grep -n "runTransaction(" index.html | grep -vE "boundedTx|function boundedTx|Promise\.race\(|^[0-9]+:\s*//" || true)   # Promise.race([tx, delai]) = borne posee AVANT boundedTx (2 sites : doSave, saveFicheConfigs)
          [ -z "$UNB3" ] || { echo "$UNB3"; echo "transaction(s) Firestore hors boundedTx"; exit 1; }
          [ "$(grep -c 'await logAudit(' index.html || true)" = "0" ] || { grep -n 'await logAudit(' index.html; echo "await logAudit( interdit (L501 : logAudit ne doit jamais bloquer un flux)"; exit 1; }
  # [L520 · passe adverse] SMOKES ET SIMULATION AVEC CHROME (battery.sh etapes 5-7, transposees). Le deploiement ne depend PAS de ce job
  # (la batterie locale les a deja joues pour un push humain) ; la routine « signalements » exige verifier ET smoke verts avant toute fusion.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # [22/09/2026] le job supposait Chrome preinstalle a /usr/bin/google-chrome. L image ubuntu-latest a change :
      # « Error: chrome not up » sur le lot L533, alors que les 5 publications du 18/09 etaient vertes. Le harnais
      # (sim200.mjs, shot.mjs) lit CHROME_BIN : on le RESOUT, et on installe seulement si rien n est trouve.
      - name: Chrome (chemin resolu, installe seulement si absent)
        run: |
          set -euo pipefail
          BIN=""
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium-browser /usr/bin/chromium /opt/google/chrome/chrome /snap/bin/chromium; do
            if [ -x "$c" ]; then BIN="$c"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "aucun Chrome dans l image du runner : installation de google-chrome-stable"
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update -qq
            sudo apt-get install -y -qq /tmp/chrome.deb
            BIN=/usr/bin/google-chrome
          fi
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          echo "Chrome : $BIN"
          "$BIN" --version
      - name: Serveur local :8000 (version servie = version du depot)
        run: |
          set -euo pipefail
          (python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for i in $(seq 1 20); do curl -fsS --max-time 1 -o /dev/null http://127.0.0.1:8000/index.html 2>/dev/null && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8000/index.html | grep -o "APP_VERSION='[^']*'" | head -1
      - name: Simulation (plancher 8 scenarios, rapport relu)
        run: |
          set -euo pipefail
          node tests/sim200.mjs --n 8 --seed 7 --multi 0.5 > /tmp/_sim.log 2>&1 || { tail -12 /tmp/_sim.log; exit 1; }
          grep -q "🏆" /tmp/_sim.log || { tail -12 /tmp/_sim.log; exit 1; }
          node -e "const r=require('./tests/sim200-report.json'); const s=r.summary||r; if((s.withBugs||0)+(s.jsErrors||0)+(s.domGuards||0)>0||(s.n||0)<8){console.log(JSON.stringify(s));process.exit(1)} console.log('rapport relu : n='+s.n)"
      - name: Smokes (6 scenes, capteur d erreurs et sentinelles)
        run: |
          set -euo pipefail
          for s in plan fiche fiche-start fiche-cut donnees analyse; do
            if ! node tests/shot.mjs --scene "$s" --out "/tmp/_smoke_$s.png" --json > "/tmp/_smoke_$s.log" 2>&1; then tail -8 "/tmp/_smoke_$s.log"; echo "smoke $s : shot.mjs sort en erreur"; exit 1; fi
            if grep -qiE "SETUP ERR|pageerror|CAPTEUR ABSENT|❌" "/tmp/_smoke_$s.log"; then tail -8 "/tmp/_smoke_$s.log"; echo "smoke $s : sentinelle d erreur"; exit 1; fi
            printf '%-11s ok\n' "$s"
          done
  # Single deploy job since we're just deploying
  deploy:
    needs: verifier
    if: github.event_name != 'pull_request'   # [L520] jamais de deploiement depuis une PR
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assembler le site public
        run: |
          set -euo pipefail
          mkdir -p _site
          # Les 3 fichiers indispensables : leur absence casse la production.
          cp index.html manifest.json sw.js _site/
          # Icônes si un jour ajoutées à la racine (icon-192.png est en 404 aujourd'hui).
          cp icon-*.png _site/ 2>/dev/null || true
          echo "--- contenu publie ---"
          ls -l _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
