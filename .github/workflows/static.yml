# Déploiement du site statique sur GitHub Pages.
#
# [passation 2026.08.24] On ne publie PLUS le dépôt entier (`path: '.'`).
# Motif : GitHub Pages servait publiquement firestore.rules, storage.rules,
# functions/index.js, CLAUDE.md, tests/ et graphify-out/ — vérifié en HTTP 200.
# Seuls les 3 fichiers dont l'application a besoin au runtime sont publiés.
# Le service worker (sw.js) ne met en cache que index.html + les SDK Firebase,
# et manifest.json ne déclare aucune icône : cette liste est donc complète.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assembler le site public
        run: |
          set -euo pipefail
          mkdir -p _site
          # Les 3 fichiers indispensables : leur absence casse la production.
          cp index.html manifest.json sw.js _site/
          # Icônes si un jour ajoutées à la racine (icon-192.png est en 404 aujourd'hui).
          cp icon-*.png _site/ 2>/dev/null || true
          echo "--- contenu publie ---"
          ls -l _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
